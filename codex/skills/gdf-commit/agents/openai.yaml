interface:
  display_name: "Gdf Commit"
  short_description: "Run the gdf-based commit helper"
  default_prompt: "Use $gdf-commit to run the commit review helper through gdf with an explicit mode; wait for confirmation in --staged, --all, and --ask modes, while --staged-yes and --all-yes preconfirm the commit gate. Add a -push suffix to any mode to push the branch after the commit lands."
